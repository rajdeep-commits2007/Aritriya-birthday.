<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy Birthday Aritriya</title>
<style>
:root{--pink:#ff8fb1;--lav:#c9a7ff;--gold:#ffd166;--text:#4a2c50;--card:#fffffff0;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);}
*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{margin:0;min-height:100vh;font-family:'Segoe UI',system-ui,sans-serif;color:var(--text);
background:linear-gradient(-45deg,#ffe3ef,#f3e8ff,#e3f0ff,#fff0d9);background-size:400% 400%;
animation:bgshift 16s ease infinite;overflow-x:hidden;position:relative;}
@keyframes bgshift{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
.stage{display:none;min-height:100vh;flex-direction:column;align-items:center;justify-content:center;
text-align:center;padding:70px 16px 40px;position:relative;z-index:2;}
.stage.active{display:flex;animation:fadein .6s ease;}
@keyframes fadein{from{opacity:0}to{opacity:1}}
h1{font-size:clamp(1.8rem,7vw,3rem);margin:.2em 0;background:linear-gradient(90deg,#ff6f91,#a685e2,#ff9a6f);
background-size:200% auto;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 3s linear infinite;}
@keyframes shine{to{background-position:200% center}}
h2{font-size:1.4rem;margin:.3em 0;color:#7a4a8a;}
p{line-height:1.6;font-size:1.02rem;max-width:440px;}
.card{background:var(--card);border-radius:22px;padding:24px 20px;max-width:460px;width:100%;
box-shadow:0 10px 30px rgba(180,120,180,.28);backdrop-filter:blur(4px);}
button{background:linear-gradient(90deg,var(--pink),var(--lav));background-size:200% auto;color:#fff;border:none;
padding:12px 26px;border-radius:999px;font-size:1rem;font-weight:600;cursor:pointer;
box-shadow:0 6px 18px rgba(255,140,180,.4);transition:transform .2s,background-position .4s;}
button:hover{background-position:100% center}button:active{transform:scale(.94)}
#topbar{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;align-items:center;justify-content:space-between;
padding:calc(10px + env(safe-area-inset-top,0px)) 14px 10px;font-size:.8rem;opacity:.85;}
#progress{background:#ffffffaa;padding:5px 12px;border-radius:999px;font-weight:600;}
#musicBtn{background:#ffffffaa;border:none;border-radius:50%;width:34px;height:34px;font-size:1.1rem;cursor:pointer;}
#skipBtn{position:fixed;bottom:8px;right:10px;z-index:20;opacity:.12;font-size:.6rem;background:none;border:none;
color:#4a2c50;padding:4px;cursor:pointer;}
/* balloons */
#balloonArea{position:relative;width:100%;max-width:520px;height:58vh;margin-top:6px;}
.bln{position:absolute;width:50px;height:64px;border-radius:50%/60% 60% 40% 40%;cursor:pointer;
animation:drift ease-in-out infinite alternate;}
@keyframes drift{from{transform:translateY(0) translateX(0) rotate(-3deg)}to{transform:translateY(-24px) translateX(14px) rotate(3deg)}}
.bln .tag{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:1.1rem;pointer-events:none;}
#arrowPtr{position:fixed;font-size:1.6rem;z-index:15;pointer-events:none;animation:wag 1s ease-in-out infinite;}
@keyframes wag{0%,100%{transform:rotate(-10deg)}50%{transform:rotate(10deg)}}
.pop-particle{position:fixed;font-size:1.05rem;z-index:16;pointer-events:none;animation:popfly .7s ease-out forwards;}
@keyframes popfly{to{transform:translate(var(--dx),var(--dy)) scale(1.3);opacity:0}}
.confetti{position:fixed;top:-10px;width:8px;height:13px;z-index:9;pointer-events:none;}
.heart-f{position:fixed;bottom:-30px;font-size:1.1rem;z-index:6;pointer-events:none;animation:hf linear forwards;}
@keyframes hf{to{transform:translateY(-100vh) translateX(30px);opacity:0}}
#reveal{display:none;}
#reveal.show{display:block;animation:popin .5s cubic-bezier(.2,1.4,.4,1);}
@keyframes popin{0%{opacity:0;transform:scale(.4)}60%{opacity:1;transform:scale(1.1)}100%{transform:scale(1)}}
.caret{display:inline-block;width:2px;background:#a685e2;animation:blink .8s step-end infinite;margin-left:2px;}
@keyframes blink{50%{opacity:0}}
/* gift box */
.giftbox{font-size:6rem;cursor:pointer;animation:shake 1.6s ease-in-out infinite;user-select:none;}
@keyframes shake{0%,100%{transform:rotate(0)}20%{transform:rotate(-4deg)}40%{transform:rotate(4deg)}60%{transform:rotate(-3deg)}80%{transform:rotate(3deg)}}
.giftbox.opened{animation:none;transform:scale(1.4) translateY(-20px) rotate(8deg);opacity:0;transition:.5s ease;}
/* carousel */
.carousel{position:relative;width:100%;max-width:380px;margin:10px auto 0;border-radius:18px;overflow:hidden;
box-shadow:0 10px 26px rgba(150,90,140,.3);aspect-ratio:3/4;background:#000;}
.slide{position:absolute;inset:0;opacity:0;transition:opacity .6s ease,transform .6s ease;transform:scale(1.04);}
.slide.active{opacity:1;transform:scale(1);z-index:2;}
.slide img{width:100%;height:100%;object-fit:cover;display:block;cursor:zoom-in;}
.cap{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(transparent,rgba(0,0,0,.65));
color:#fff;font-size:.85rem;padding:20px 10px 8px;text-align:left;}
.car-btn{position:absolute;top:50%;transform:translateY(-50%);background:rgba(255,255,255,.75);border:none;
width:36px;height:36px;border-radius:50%;font-size:1rem;cursor:pointer;z-index:3;}
.car-btn.prev{left:8px}.car-btn.next{right:8px}
.dots{display:flex;justify-content:center;gap:8px;margin-top:10px;}
.dot{width:8px;height:8px;border-radius:50%;background:#e3c6da;cursor:pointer;transition:.3s;}
.dot.active{background:linear-gradient(90deg,var(--pink),var(--lav));width:20px;border-radius:6px;}
.lightbox{position:fixed;inset:0;background:rgba(20,10,25,.9);display:none;align-items:center;justify-content:center;
z-index:50;padding:20px;flex-direction:column;}
.lightbox.show{display:flex;animation:fadein .3s ease;}
.lightbox img{max-width:100%;max-height:78vh;border-radius:14px;}
.lightbox .cap2{color:#fff;margin-top:10px;font-size:.9rem;}
.lightbox-close{position:absolute;top:16px;right:20px;color:#fff;font-size:2rem;cursor:pointer;}
/* quiz */
.quiz-q{font-weight:700;margin:14px 0 10px;}
.opt{display:block;width:100%;text-align:left;background:#ffffffb0;border:2px solid #f0d5e6;color:var(--text);
border-radius:12px;padding:10px 14px;margin:8px 0;cursor:pointer;font-size:.95rem;transition:.2s;}
.opt.right{background:#d9f7e3;border-color:#8fdca6;}
.opt.pick{border-color:var(--lav);}
.reaction{margin-top:10px;font-size:.95rem;min-height:1.4em;color:#8a4a6a;font-weight:600;}
/* envelope */
.envelope{font-size:5.5rem;cursor:pointer;animation:sway 2.4s ease-in-out infinite;user-select:none;}
@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
.letter{display:none;text-align:left;background:#fffef8;border-radius:14px;padding:20px;margin-top:14px;
box-shadow:0 8px 24px rgba(0,0,0,.15);font-size:.98rem;line-height:1.7;}
.letter.show{display:block;animation:fadein .6s ease;}
/* final stage */
#stage6{background:radial-gradient(ellipse at top,#241436,#0d0620);}
.star2{position:absolute;border-radius:50%;background:#fff;animation:tw ease-in-out infinite;}
@keyframes tw{0%,100%{opacity:.2}50%{opacity:1}}
.firefly{position:absolute;width:5px;height:5px;border-radius:50%;background:#ffe9a8;box-shadow:0 0 8px 3px #ffe9a8;
animation:fly 6s ease-in-out infinite;}
@keyframes fly{0%,100%{transform:translate(0,0)}50%{transform:translate(20px,-30px)}}
.fcake{font-size:4.5rem;position:relative;margin-top:10px;}
.candleF{font-size:1.3rem;cursor:pointer;position:relative;display:inline-block;margin:0 4px;transition:opacity .3s;}
#stage6 h1,#stage6 h2,#stage6 p{color:#fff;-webkit-text-fill-color:#fff;background:none;}
.wishline{opacity:.85;font-size:1rem;margin-top:6px;}
</style>
</head>
<body>
<div id="topbar"><div id="progress">Stage 1 / 6</div><button id="musicBtn" onclick="toggleMusic()">🔇</button></div>

<div class="stage active" id="stage1">

    <h1 id="typed1"></h1><span class="caret">&nbsp;</span>
    <h2 id="typed2" style="opacity:0"></h2>
    <button style="margin-top:16px" onclick="goStage(2)">Continue →</button>
  </div>
</div>

<div class="stage" id="stage2">
